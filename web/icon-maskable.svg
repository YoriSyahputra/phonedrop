<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="50%" stop-color="#0e1411" />
      <stop offset="100%" stop-color="#070b09" />
    </linearGradient>

    <linearGradient id="brassGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6cc" />
      <stop offset="50%" stop-color="#d4b88a" />
      <stop offset="100%" stop-color="#9e7d47" />
    </linearGradient>

    <linearGradient id="screenGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2923" />
      <stop offset="100%" stop-color="#121815" />
    </linearGradient>

    <filter id="glowM" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradFull)" />

  <!-- Inner Ambient Glow Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#25352c" stroke-width="2" stroke-opacity="0.5" />

  <!-- Laptop Base (Subtle bottom anchor) -->
  <g filter="url(#dropShadowM)">
    <path d="M 130 350 L 382 350 C 394 350 402 358 402 370 L 402 374 C 402 384 390 392 376 392 L 136 392 C 122 392 110 384 110 374 L 110 370 C 110 358 118 350 130 350 Z" 
          fill="#1c2420" stroke="url(#brassGradM)" stroke-width="3" stroke-opacity="0.6" />
    <line x1="230" y1="362" x2="282" y2="362" stroke="#d4b88a" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Smartphone Frame (Central Focus) -->
  <g filter="url(#dropShadowM)">
    <rect x="180" y="106" width="152" height="226" rx="30" ry="30" 
          fill="url(#screenGradM)" stroke="url(#brassGradM)" stroke-width="7" />
    
    <rect x="228" y="122" width="56" height="5" rx="2.5" ry="2.5" fill="#6e685f" />
    
    <rect x="194" y="138" width="124" height="162" rx="14" ry="14" 
          fill="#0c120f" stroke="#25352c" stroke-width="2" />
          
    <path d="M 226 182 C 240 170 272 170 286 182" 
          fill="none" stroke="#d4b88a" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M 216 166 C 236 150 276 150 296 166" 
          fill="none" stroke="#d4b88a" stroke-width="4" stroke-linecap="round" stroke-opacity="0.3" />

    <path d="M 256 198 L 256 248 M 240 232 L 256 248 L 272 232" 
          fill="none" stroke="url(#brassGradM)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <circle cx="256" cy="274" r="6" fill="#f5e6cc" filter="url(#glowM)" />
  <circle cx="256" cy="274" r="4" fill="#ffffff" />
</svg>
