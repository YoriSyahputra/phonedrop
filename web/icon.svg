<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="50%" stop-color="#0e1411" />
      <stop offset="100%" stop-color="#070b09" />
    </linearGradient>

    <!-- Brass / Gold Glow Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6cc" />
      <stop offset="50%" stop-color="#d4b88a" />
      <stop offset="100%" stop-color="#9e7d47" />
    </linearGradient>

    <!-- Subtle Accent Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2923" />
      <stop offset="100%" stop-color="#121815" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="#d4b88a" stroke-width="6" stroke-opacity="0.25" />

  <!-- Inner Ambient Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" ry="92" fill="none" stroke="#25352c" stroke-width="2" stroke-opacity="0.6" />

  <!-- Laptop Base (Subtle bottom anchor) -->
  <g filter="url(#dropShadow)">
    <!-- Laptop screen / body silhouette -->
    <path d="M 120 350 L 392 350 C 404 350 412 358 412 370 L 412 374 C 412 384 400 392 386 392 L 126 392 C 112 392 100 384 100 374 L 100 370 C 100 358 108 350 120 350 Z" 
          fill="#1c2420" stroke="url(#brassGrad)" stroke-width="3" stroke-opacity="0.6" />
    <!-- Laptop notch / trackpad line -->
    <line x1="230" y1="362" x2="282" y2="362" stroke="#d4b88a" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Smartphone Frame (Central Focus) -->
  <g filter="url(#dropShadow)">
    <!-- Phone Outer Body -->
    <rect x="176" y="96" width="160" height="236" rx="32" ry="32" 
          fill="url(#screenGrad)" stroke="url(#brassGrad)" stroke-width="7" />
    
    <!-- Phone Speaker Notch -->
    <rect x="226" y="112" width="60" height="6" rx="3" ry="3" fill="#6e685f" />
    
    <!-- Phone Screen Inner Inset -->
    <rect x="190" y="130" width="132" height="170" rx="16" ry="16" 
          fill="#0c120f" stroke="#25352c" stroke-width="2" />
          
    <!-- Phone Screen Content: Signal Waves & Arrow Down (Drop) -->
    <!-- Wi-Fi / Sync Waves radiating downward -->
    <path d="M 224 180 C 238 168 274 168 288 180" 
          fill="none" stroke="#d4b88a" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M 212 162 C 234 144 278 144 300 162" 
          fill="none" stroke="#d4b88a" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.3" />

    <!-- Center Drop Arrow / Transfer Beam -->
    <path d="M 256 195 L 256 250 M 238 232 L 256 250 L 274 232" 
          fill="none" stroke="url(#brassGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Accent Dot (The Brand Dot) -->
  <circle cx="256" cy="278" r="7" fill="#f5e6cc" filter="url(#glow)" />
  <circle cx="256" cy="278" r="4.5" fill="#ffffff" />
</svg>
